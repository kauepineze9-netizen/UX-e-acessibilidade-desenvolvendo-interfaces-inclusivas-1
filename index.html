<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu de Acessibilidade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Botão principal de ativação por voz -->
  <button id="btn-voz" class="btn-voice-command" aria-label="Ativar comando de voz. Atalho: Alt + V" accesskey="v">
    <span class="mic-icon" aria-hidden="true">🎙️</span>
    <span>Ativar Comando de Voz (Alt + V)</span>
  </button>

  <!-- Menu de Acessibilidade -->
  <nav class="accessibility-menu" aria-label="Menu de Acessibilidade">
    <h1 class="menu-title">Menu de Acessibilidade</h1>
    
    <ul class="menu-list" role="menu">
      
      <li role="none">
        <button role="menuitem" class="menu-btn" accesskey="1" aria-label="Opção 1: Alternar Alto Contraste. Atalho: Alt + 1">
          <span class="option-number">1.</span> Alternar Alto Contraste
        </button>
      </li>

      <li role="none">
        <button role="menuitem" class="menu-btn" accesskey="2" aria-label="Opção 2: Aumentar Tamanho do Texto. Atalho: Alt + 2">
          <span class="option-number">2.</span> Aumentar Texto
        </button>
      </li>

      <li role="none">
        <button role="menuitem" class="menu-btn" accesskey="3" aria-label="Opção 3: Alterar Velocidade da Voz do Leitor. Atalho: Alt + 3">
          <span class="option-number">3.</span> Velocidade da Voz
        </button>
      </li>

      <li role="none">
        <button role="menuitem" class="menu-btn" accesskey="4" aria-label="Opção 4: Ler Conteúdo da Tela. Atalho: Alt + 4">
          <span class="option-number">4.</span> Ler Tela Atual
        </button>
      </li>

      <li role="none">
        <button role="menuitem" class="menu-btn btn-help" accesskey="5" aria-label="Opção 5: Abrir Ajuda dos Comandos de Voz. Atalho: Alt + 5">
          <span class="option-number">5.</span> Ajuda de Voz
        </button>
      </li>

    </ul>
  </nav>

  <!-- Status do Assistente de Voz -->
  <div id="status-voz" class="voice-status" aria-live="polite">
    Assistente de voz pronto. Diga um comando ou use os atalhos numéricos.
  </div>

</body>
</html>
